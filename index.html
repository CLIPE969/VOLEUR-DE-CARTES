function creerGrille(id){

let g=document.getElementById(id);

c.className="carte";

c.onclick=function(){
clicCarte(c);
};

}

}

function piocher(){

let p=document.getElementById("pioche");
p.innerHTML="";

for(let i=0;i<7;i++){

let l=sac[Math.floor(Math.random()*sac.length)];

let c=document.createElement("div");
c.className="carte";
c.innerText=l;

c.onclick=function(){
clicCarte(c);
};

p.appendChild(c);

}

}

piocher();

function clicCarte(c){

if(lettreMain==null){

if(c.innerText=="") return;

lettreMain=c.innerText;
c.innerText="";

}
else{

if(c.innerText==""){

c.innerText=lettreMain;
lettreMain=null;

}

}

}

function nouvellePioche(){

if(piocheUtilisee){

popup("Valider votre jeu !");
return;

}

piocheUtilisee=true;
piocher();

}

function lireMots(grilleId){

let g=document.getElementById(grilleId);
let cartes=g.children;
let mots=[];

for(let l=0;l<5;l++){

let mot="";

for(let c=0;c<10;c++){

let i=l*10+c;
let t=cartes[i].innerText.toUpperCase();

if(t!=""){
mot+=t;
}else{
if(mot.length>=3) mots.push(mot);
mot="";
}

}

if(mot.length>=3) mots.push(mot);

}

return mots;

}

function verifierDico(mots){

for(let m of mots){

if(m.length>=3 && !dico.includes(m)){
popup("mot inconnu : "+m);
return false;
}

}

return true;

}

function ajouterMemo(mots){

for(let m of mots){

if(m.length>=3 && !memoA.includes(m)){
memoA.push(m);
}

}

afficherMemo();

}

function afficherMemo(){

memoA.sort();

document.getElementById("memoA").innerText=memoA.join(" ");

}

function valider(){

let mots=lireMots("grilleA");

if(mots.length>0){

if(!verifierDico(mots)){
return;
}

ajouterMemo(mots);

}

piocheUtilisee=false;

popup("Nouvelle pioche!");

}

function nouvelle(){

afficherResultatNouvellePartie();

}
function afficherResultatNouvellePartie(){

let totalPoints=0;
let liste="";

for(let mot of memoA){

let longueur=mot.length;

if(longueur>=5 && longueur<=10){

let points=longueur*2;
totalPoints+=points;

liste+="<div>"+mot.toUpperCase()+" — "+points+" points</div>";

}

}

if(liste==""){
liste="<div>Aucun mot de 5 à 10 lettres trouvé.</div>";
}

let fond=document.createElement("div");
fond.id="resultatNouvellePartie";

fond.innerHTML=
"<div class='resultatBoite'>"+
"<div class='resultatBravo'>BRAVO !</div>"+
"<div class='resultatPoints'>"+totalPoints+" points</div>"+
"<div class='listeMots'>"+liste+"</div>"+
"<button class='boutonFermerResultat' onclick='fermerResultatNouvellePartie();'>OK</button>"+
"</div>";

document.body.appendChild(fond);

}

function fermerResultatNouvellePartie(){

let popupResultat=document.getElementById("resultatNouvellePartie");

if(popupResultat){
popupResultat.remove();
}
